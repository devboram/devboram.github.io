# 컨셉 변천 기록(/concept.html) — 단계마다 시도·결과(채택/철회)·이유를 남긴다. 새 결정이 생기면 맨 아래에 추가.
current: 미래도시의 달빛 옥상 — 사이버펑크 밤 도시 × 90년대 마법소녀 감성, 귀여운 마스코트 파티
principles:
  - 실제 작품 캐릭터(세일러문·웨딩피치·세균맨·치이카와·호빵맨·마리오 등)는 그리지 않는다. 오마주도 알아볼 수 있으면 쓰지 않는다 — 장르 요소(초승달·별 요술봉·리본·날개·하트)와 귀여움 원리만 가져온다.
  - 귀여움 원리 — 머리:몸 1:1, 단순한 둥근 실루엣, 짧고 뭉툭한 팔다리, 얼굴 아래쪽에 넓게 벌린 점 눈, 작은 입, 볼터치, 굵고 일정한 외곽선, 적은 색 수.
  - 팔레트는 장면 네온(핫핑크·시안·금·라벤더) 안에서. 베이비 핑크·베이비 블루는 어울리지 않아 쓰지 않는다.
  - 글자 대비는 WCAG AA(4.5:1) 이상, 움직임 줄이기 설정에서는 모든 반복 애니메이션을 멈춘다.
  - 사람 얼굴을 코드(도형)로 그리면 어색하다 — 인물·캐릭터 일러스트는 이미지 생성 도구로 만든다.
  - 캐릭터 일러스트는 두 벌 — 기본(assets/chars, 표정·소품이 풍성한 버전)은 평소에, 치비 2등신(assets/chars/chibi)은 이벤트·이스터에그·404 같은 특별한 순간에만 쓴다.
steps:
  - title: 손그림 노트(종이) 컨셉
    status: 이전 컨셉
    note: 종이 괘선 배경, 손글씨 글꼴(Gaegu), 마스킹테이프·형광펜, 손그림 토끼. 다른 페이지는 아직 이 테마.
  - title: 리팩토링·디자인 토큰 1단계
    status: 채택
    note: 인라인 style 제거, 색·글꼴·그림자 토큰화(화면 변화 0으로 검증).
  - title: 픽셀 게임 컨셉 전환 — 밝은 16비트 하늘
    status: 대체됨
    note: 하늘 띠·잔디 블록·대화창. 이후 레퍼런스를 보고 밤 장면으로 바뀜.
  - title: 캐릭터 디테일 32x32
    status: 채택
    note: 도형을 겹치고 외곽선·명암을 자동으로. 토끼·로봇·고양이·슬라임.
  - title: 레퍼런스 — Pixilart(It Takes Two, REPO Concert), Adobe Stock 픽셀 아이템
    status: 참고
    note: 'UI보다 장면(씬) 일러스트가 주인공 · 깊이 3~4겹 · 색상 도는 명암 · 반짝임 · 광택 아이템. 기법만 참고, 캐릭터·에셋은 쓰지 않음.'
  - title: 밤 네온 도시
    status: 채택
    note: 장면 PNG 480x150을 화면 폭에 따라 2~4배로. BORAM 네온 간판.
  - title: 사이버펑크 강화
    status: 일부 채택
    note: 메가타워·글리프 간판·호버카·스모그·젖은 옥상 반사. 비는 별가루로, 경고 줄무늬는 빛나는 엣지로 바뀜. 단조로운 빌딩은 14종으로 다양화.
  - title: 초승달
    status: 채택
    note: 보름달 대신 감성적인 금빛 초승달(가려진 면이 은은하게 비침).
  - title: 90년대 마법소녀 감성 + 철탑
    status: 채택
    note: 리본·하트 브로치·별 요술봉·반짝이, 핑크 격자 철탑(사용자 호평)과 송신탑.
  - title: 미래도시 시도 — 모노레일·베이비 톤
    status: 철회
    note: 철도가 너무 도드라지고 베이비 핑크·블루가 장면과 어울리지 않음.
  - title: 상용 개인 블로그 구조
    status: 채택
    note: 대표 글 카드·파티 카드·사이드바(프로필·태그·RSS)·다단 푸터, 본문 Pretendard.
  - title: 캐릭터 포즈·배치
    status: 채택
    note: 지팡이 든 토끼(옥상), 간판 위에서 자는 고양이, 하늘을 나는 로봇, 점프하는 슬라임. 브이 윙크 결정 포즈도 추가.
  - title: 전광판 변천
    status: 진행 중
    note: 흐릿한 토끼 홀로그램 → 마법소녀 아이돌(코드로 그려 어색, 철회) → 실루엣 → 컬러 토끼 광고판(현재 사이트) → 네온 윤곽·반투명 시안(별로라 미반영).
  - title: 캐릭터 설정집 페이지
    status: 채택
    note: 정면도·포즈 컷·색 견본·프로필·능력치·스토리. 이름·스토리는 초안.
  - title: 빌런 '글리치 킹'
    status: 채택
    note: 무서운 버전 → 귀여운 꼬마 악당(동그란 얼굴·작은 뿔·미니 왕관).
  - title: 아이템 도감 21종
    status: 채택
    note: 요술봉·콤팩트·브로치·물약·수정구·러버덕·버그 잠자리채·별 랜턴·딸기우유 등.
  - title: 이미지 생성 캐릭터(Figma AI)
    status: 채택
    note: 시트 2장 생성(크레딧 2회). 표정·소품이 풍성한 첫 번째 시트(CHARACTER SELECT)가 더 귀여워 채택 — 설정집 정면도·홈 파티 카드·프로필에 사용. 장면 속 작은 스프라이트는 코드 그림 유지.
  - title: 공식 설정 시트(ChatGPT 이미지 참조)
    status: 채택
    note: 텍스트만 받는 Figma AI는 캐릭터가 달라져서, 사이트 캐릭터 PNG를 첨부해 ChatGPT로 생성. 5명 모두 3면도·표정 6종·포즈 4종(앉기·눕기 포함)·소품·팔레트. 설정집 각 카드 아래에 표시. 이후 프레임으로 움직이는 GIF도 만들 수 있다.
  - title: 페이지 배경 6종·소품 도감 24종·치비 시트(ChatGPT)
    status: 채택
    note: '페이지 배경 배너 6종(글·프로젝트·캐릭터·소개·방명록·404)을 각 페이지 상단에, 소품 도감 일러스트는 아이템 도감 위에. 치비는 404(조는 토끼)·비밀 페이지(파티 전원 환호)에만. 글 상세만 아직 종이 테마.'
  - title: 게임 화면 UI
    status: 채택
    note: '헤더를 HUD(LV=글 수·HP·PARTY·ITEM)로, 메뉴를 게임 커맨드(QUEST·ITEMS·PARTY·STATUS·SAVE)와 ▶ 커서로. 홈은 타이틀 화면(NEON CITY NOVA·시작 메뉴·PRESS START). 글=퀘스트 로그(CLEAR), 프로젝트=인벤토리, 캐릭터=CHARACTER SELECT, 소개=STATUS(능력치), 방명록=세이브 포인트, 404=GAME OVER·CONTINUE?, 비밀=SECRET STAGE CLEAR.'
  - title: 글 상세 = 퀘스트 화면
    status: 채택
    note: '퀘스트 정보 창(CLEAR·태그·읽는 시간) → 본문 창(▶ 소제목, 코드 블록) → QUEST CLEAR(치비 토끼, EXP = 읽는 시간×10) → ◀ 이전·다음 ▶ → 댓글(어두운 테마). 참 잘했어요 도장은 퇴장. 이로써 전 페이지 픽셀 테마.'
  - title: 스프라이트 프레임 애니메이션(시험 — 토끼 손 흔들기)
    status: 진행 중
    note: 'GIF·Lottie 대신 프레임 스트립(WebP) + CSS. ChatGPT 에 초록 단색(#00FF00) 배경으로 프레임을 받아 배경을 빼고 칸 위치를 보존해 붙인다(흰 캐릭터는 흰 배경이면 귀까지 지워진다). 손 흔들기 4프레임 → 요술봉 휘두르며 리듬체조 한 바퀴 + 반짝이 꼬리 6프레임(준비·결정 포즈에서 멈춤)으로 교체해 홈 옥상 토끼에 적용. 나머지 4명은 ChatGPT 무료 이미지 한도로 다음 날 이어서.'
