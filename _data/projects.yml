# 사냥 장비 — 홈 카드(summary)·인벤토리 페이지 카드(description·real)·3D 스테이지 전시(앞 3개)가 함께 읽는다. 순서가 곧 노출 순서.
# real = 이 장비가 빗댄 실제 디버깅 도구. avatar = 장비를 든 동료(assets/chars/<키>.png, 설정집 /characters.html#<키>)
- name: 별빛 돋보기
  real: Logcat
  summary: 어둠 속 버그의 발자국을 환하게 비춘다.
  description: 버그는 반드시 발자국을 남긴다. 돋보기로 로그를 비추면 지나간 길이 별빛처럼 떠오른다.
  avatar: bunny

- name: 달빛 망원경
  real: Profiler
  summary: 느려진 화면 뒤에 숨은 버그를 멀리서 찾아낸다.
  description: 화면이 뚝뚝 끊기는 골목에는 꼭 누군가 숨어 있다. 망원경을 돌리면 어디서 시간이 새는지 보인다.
  avatar: robot

- name: 되감기 나침반
  real: git bisect
  summary: 바늘이 버그가 태어난 커밋을 가리킨다.
  description: 어제까지 멀쩡했다면 그 사이 어딘가다. 밤을 반씩 접어 가며 버그가 처음 나타난 날을 짚어 낸다.
  avatar: cat

- name: 시간 정지 그물
  real: 브레이크포인트
  summary: 달아나던 버그가 그 자리에 딱 멈춘다.
  description: 던지면 시간이 멈춘다. 멈춘 버그 주위를 천천히 돌며 주머니에 무엇을 숨겼는지 들여다본다.
  avatar: slime

- name: 표본 유리병
  real: 재현 테스트
  summary: 한번 잡은 버그는 다시 빠져나오지 못한다.
  description: 잡은 버그를 넣고 뚜껑을 닫아 둔다. 글리치 킹이 이 세상에서 제일 싫어하는 병.
  avatar: villain
