# 버그 도감 — 건물 밖에서 만나는 버그와 채집 문제. (초안, 정답 검토 전 — 아직 게임에 연결하지 않았다)
# q: 문제(짧게) · hint: 아이템을 써서 보는 힌트 한 줄 · choices: 보기 2~3개(O/X 문제는 ["O", "X"]) · answer: 정답 보기의 순서(0부터) · why: 도감에 남는 해설
- key: npe
  name: 널이
  desc: 비어 있는 값만 골라 밟는 버그.
  q: "`name!!.length` — name 이 null 이면?"
  hint: "`!!` 는 '절대 null 이 아니다' 라고 우기는 연산자다."
  choices: ["예외가 난다", "0 이 나온다"]
  answer: 0
  why: "`!!` 는 null 이면 NullPointerException 을 던진다. `?.` 와 `?:` 로 받는 편이 안전하다."
- key: anr
  name: 멈춤이
  desc: 화면을 얼려 놓고 꼼짝 않는 달팽이.
  q: "메인 스레드에서 오래 걸리는 일을 하면?"
  hint: "ANR 은 Application Not Responding 의 줄임말."
  choices: ["ANR 이 뜬다", "배터리가 절약된다"]
  answer: 0
  why: "메인 스레드가 입력에 약 5초 넘게 응답하지 못하면 '앱이 응답하지 않음(ANR)' 이 뜬다."
- key: leak
  name: 새는이
  desc: 다 쓴 화면을 놓아주지 않는 거머리.
  q: "Activity 를 companion object 변수에 담아 두면 메모리 누수 위험이 있다."
  hint: "companion object 는 앱이 끝날 때까지 살아 있다."
  choices: ["O", "X"]
  answer: 0
  why: "화면이 끝나도 참조가 남아 가비지 컬렉터가 Activity 를 치우지 못한다."
- key: rotate
  name: 뒤집이
  desc: 화면을 돌리면 값을 물고 달아난다.
  q: "화면 회전 뒤에도 값을 지키는 것은?"
  hint: "이름에 '저장할 수 있다' 는 뜻이 들어 있는 쪽."
  choices: ["remember", "rememberSaveable"]
  answer: 1
  why: "`remember` 는 리컴포지션만 견딘다. 회전 같은 구성 변경까지 견디려면 `rememberSaveable`."
- key: recompose
  name: 깜빡이
  desc: 같은 화면을 자꾸 다시 그리게 만든다.
  q: "Compose 에서 상태가 바뀌어 화면을 다시 그리는 일은?"
  hint: "Compose 를 '다시(re)' 하는 일."
  choices: ["리컴포지션", "리베이스", "리부팅"]
  answer: 0
  why: "상태를 읽는 Composable 만 다시 실행된다. 이것이 리컴포지션이다."
- key: lazykey
  name: 뒤섞이
  desc: 목록 순서를 바꾸면 칸의 기억을 섞어 놓는다.
  q: "LazyColumn 항목 순서가 바뀌어도 상태가 엉키지 않게 주는 것은?"
  hint: "항목마다 붙이는 고유한 이름표."
  choices: ["key", "weight"]
  answer: 0
  why: "`items(list, key = { it.id })` 처럼 key 를 주면 항목이 위치가 아니라 정체로 구분된다."
- key: sideeffect
  name: 되풀이
  desc: 같은 요청을 몇 번이고 다시 보낸다.
  q: "Composable 본문에서 네트워크를 바로 호출해도 된다."
  hint: "본문은 화면을 다시 그릴 때마다 또 실행된다."
  choices: ["O", "X"]
  answer: 1
  why: "본문은 리컴포지션마다 다시 실행될 수 있다. `LaunchedEffect` 안이나 ViewModel 에서 호출한다."
- key: lifecycle
  name: 밤샘이
  desc: 화면이 꺼져도 혼자 일을 계속한다.
  q: "화면이 안 보이면 Flow 수집을 멈춰 주는 것은?"
  hint: "이름에 Lifecycle 이 들어간 쪽이 생명주기를 안다."
  choices: ["collectAsState", "collectAsStateWithLifecycle"]
  answer: 1
  why: "`collectAsStateWithLifecycle` 은 화면이 STARTED 아래로 내려가면 수집을 멈춘다."
- key: scope
  name: 떠돌이
  desc: 주인이 사라져도 떠돌아다니는 코루틴.
  q: "ViewModel 에서 코루틴을 띄울 때 쓰는 스코프는?"
  hint: "ViewModel 과 수명이 같은 쪽."
  choices: ["GlobalScope", "viewModelScope"]
  answer: 1
  why: "`viewModelScope` 는 ViewModel 이 없어질 때 함께 취소된다. GlobalScope 는 끝까지 남는다."
- key: cancel
  name: 삼킴이
  desc: 그만하라는 신호까지 삼켜 버린다.
  q: "`catch (e: Exception)` 이 CancellationException 까지 삼키면 코루틴 취소가 깨질 수 있다."
  hint: "코루틴의 취소도 예외의 한 종류로 전달된다."
  choices: ["O", "X"]
  answer: 0
  why: "취소도 예외로 전달된다. 삼켰다면 다시 던져야 취소가 위로 전해진다."
- key: dispatcher
  name: 길막이
  desc: 좁은 길 한가운데에서 짐을 푼다.
  q: "파일 읽기 같은 입출력에 맞는 디스패처는?"
  hint: "IO 는 Input/Output 의 줄임말."
  choices: ["Dispatchers.Main", "Dispatchers.IO"]
  answer: 1
  why: "Main 은 화면을 그리는 스레드다. 기다리는 일이 많은 입출력은 IO 로 보낸다."
- key: lateinit
  name: 성급이
  desc: 준비되기도 전에 손부터 뻗는다.
  q: "초기화 전에 `lateinit var` 를 읽으면?"
  hint: "lateinit 은 null 을 허용하지 않는 타입에만 쓴다."
  choices: ["null 이 나온다", "예외가 난다"]
  answer: 1
  why: "UninitializedPropertyAccessException 이 난다. `::변수.isInitialized` 로 확인할 수 있다."
- key: equals
  name: 쌍둥이
  desc: 똑같이 생겼지만 같은 개체는 아니다.
  q: "Kotlin 에서 `==` 는 내용 비교, `===` 는 참조 비교다."
  hint: "등호가 하나 더 많은 쪽이 더 엄격하다."
  choices: ["O", "X"]
  answer: 0
  why: "`==` 는 `equals()` 를 부른다. 같은 객체인지 보려면 `===`."
- key: val
  name: 슬쩍이
  desc: 잠가 둔 상자 안을 슬쩍 바꿔 놓는다.
  q: "`val list = mutableListOf(1)` 에 `list.add(2)` 를 할 수 있다."
  hint: "val 이 막는 것은 변수에 다른 것을 다시 넣는 일뿐."
  choices: ["O", "X"]
  answer: 0
  why: "`val` 은 다시 대입하는 것만 막는다. 안의 내용까지 막으려면 `List` 로 드러낸다."
- key: context
  name: 붙잡이
  desc: 오래 사는 객체에 화면을 붙들어 맨다.
  q: "싱글턴처럼 오래 사는 객체에 넘길 Context 는?"
  hint: "앱이 켜져 있는 내내 살아 있는 쪽."
  choices: ["Activity", "applicationContext"]
  answer: 1
  why: "Activity 를 넘기면 화면이 끝나도 놓아주지 못한다. 앱 수명과 같은 applicationContext 를 쓴다."
- key: r8
  name: 이름지움이
  desc: 릴리즈 빌드에서만 나타나 이름표를 떼어 간다.
  q: "릴리즈 빌드에서만 죽는다. 먼저 의심할 것은?"
  hint: "릴리즈 빌드에서만 켜지는 것을 떠올려 보자."
  choices: ["R8 축소·난독화 규칙", "글꼴 크기"]
  answer: 0
  why: "리플렉션·직렬화로 쓰는 클래스의 이름이 바뀌거나 지워졌을 수 있다. keep 규칙을 확인한다."
- key: wrongthread
  name: 끼어들이
  desc: 남의 스레드에서 화면에 손을 댄다.
  q: "백그라운드 스레드에서 View 를 직접 고쳐도 된다."
  hint: "화면은 메인 스레드가 혼자 그린다."
  choices: ["O", "X"]
  answer: 1
  why: "View 는 만든 스레드(메인)에서만 고칠 수 있다. 어기면 CalledFromWrongThreadException."
- key: notify
  name: 조용이
  desc: 알림을 보내도 아무 소리가 나지 않게 한다.
  q: "Android 13 부터 알림을 띄우려면 필요한 런타임 권한은?"
  hint: "알림(Notification)을 올린다(Post)."
  choices: ["POST_NOTIFICATIONS", "INTERNET"]
  answer: 0
  why: "API 33 부터 알림 권한을 사용자에게 직접 받아야 한다."
- key: stateflow
  name: 메아리
  desc: 같은 말을 두 번 하면 한 번만 들린다.
  q: "StateFlow 는 같은 값을 연달아 넣으면 다시 내보내지 않는다."
  hint: "StateFlow 는 '지금 상태' 만 기억한다."
  choices: ["O", "X"]
  answer: 0
  why: "이전 값과 `equals` 로 같으면 건너뛴다. 같은 값도 매번 알리려면 SharedFlow."
- key: processdeath
  name: 유령이
  desc: 앱이 뒤에서 조용히 죽으면 기억을 지워 간다.
  q: "ViewModel 은 프로세스가 죽어도 값을 지킨다."
  hint: "ViewModel 이 견디는 것은 화면 회전까지."
  choices: ["O", "X"]
  answer: 1
  why: "ViewModel 은 구성 변경만 견딘다. 프로세스 종료까지 견디려면 SavedStateHandle 에 담는다."

# ---- 아래 20문제는 구글 공식 과정 「Android Basics with Compose」의 20개 학습 경로 주제를 하나씩 따라 새로 쓴 것이다 ----
# (과정의 퀴즈 문장을 옮긴 것이 아니다. 주제만 맞췄다. https://developer.android.com/courses/android-basics-compose/course)
- key: main
  name: 첫발이
  desc: 어디서 시작할지 몰라 제자리를 맴돈다.
  q: "Kotlin 프로그램이 실행을 시작하는 함수 이름은?"
  hint: "영어로 '주된' 이라는 뜻."
  choices: ["main", "start"]
  answer: 0
  why: "`fun main()` 이 프로그램의 진입점이다."
- key: preview
  name: 깜깜이
  desc: 화면을 보지도 않고 만들게 한다.
  q: "앱을 실행하지 않고 Composable 을 미리 보여 주는 어노테이션은?"
  hint: "'미리 보기' 를 영어로."
  choices: ["@Preview", "@Test"]
  answer: 0
  why: "`@Preview` 를 붙인 Composable 은 Android Studio 의 미리 보기 창에 그려진다."
- key: column
  name: 겹침이
  desc: 글자와 그림을 한자리에 포개 놓는다.
  q: "요소를 세로로 차례차례 쌓는 레이아웃은?"
  hint: "'기둥' 이라는 뜻의 영어 단어."
  choices: ["Row", "Column", "Box"]
  answer: 1
  why: "`Column` 은 세로, `Row` 는 가로로 놓는다. `Box` 는 겹쳐 쌓는다."
- key: when
  name: 갈팡이
  desc: 조건이 많아지면 길을 잃는다.
  q: "값에 따라 여러 갈래로 나누는 Kotlin 식은?"
  hint: "Kotlin 에는 switch 가 없다."
  choices: ["when", "switch"]
  answer: 0
  why: "Kotlin 은 `switch` 대신 `when` 을 쓴다. 값을 돌려주는 식으로도 쓸 수 있다."
- key: onclick
  name: 먹통이
  desc: 아무리 눌러도 반응이 없다.
  q: "Button 을 눌렀을 때 할 일을 넘기는 매개변수는?"
  hint: "'클릭했을 때' 를 영어로."
  choices: ["onClick", "onDraw"]
  answer: 0
  why: "`Button(onClick = { ... })` 처럼 람다로 넘긴다."
- key: state
  name: 굳은이
  desc: 값이 바뀌어도 화면은 그대로다.
  q: "Compose 가 값의 변화를 알아채게 하려면 무엇으로 감싸나?"
  hint: "'변할 수 있는 상태' 라는 뜻이 이름에 들어 있다."
  choices: ["listOf", "mutableStateOf"]
  answer: 1
  why: "`mutableStateOf` 로 만든 값이 바뀌면 그 값을 읽는 Composable 이 다시 그려진다."
- key: hoist
  name: 움켜쥠이
  desc: 상태를 혼자 쥐고 내놓지 않는다.
  q: "상태를 호출한 쪽으로 끌어올려 Composable 을 상태 없이 만드는 패턴은?"
  hint: "'끌어올리다' 는 영어로 hoist."
  choices: ["상태 호이스팅", "상태 캐싱"]
  answer: 0
  why: "값과 변경 이벤트를 매개변수로 받게 하면 재사용과 테스트가 쉬워진다."
- key: map
  name: 하나씩이
  desc: 목록을 손으로 하나하나 고치게 한다.
  q: "`listOf(1, 2, 3).map { it * 2 }` 의 결과는?"
  hint: "map 은 항목마다 식을 적용한 새 목록을 만든다."
  choices: ["[1, 2, 3]", "[2, 4, 6]"]
  answer: 1
  why: "`map` 은 원래 목록을 바꾸지 않고, 각 항목을 변환한 새 목록을 돌려준다."
- key: lazycolumn
  name: 욕심이
  desc: 보이지도 않는 항목까지 전부 그린다.
  q: "화면에 보이는 항목만 그리는 세로 목록은?"
  hint: "'게으른' 쪽이 필요한 만큼만 일한다."
  choices: ["Column", "LazyColumn"]
  answer: 1
  why: "`Column` 은 모든 항목을 한꺼번에 만든다. 긴 목록은 `LazyColumn` 을 쓴다."
- key: theme
  name: 제멋대로
  desc: 화면마다 색과 글꼴이 다르다.
  q: "앱 전체의 색·글꼴·모양을 한곳에서 정하는 것은?"
  hint: "머티리얼 디자인의 '테마'."
  choices: ["MaterialTheme", "Modifier"]
  answer: 0
  why: "`MaterialTheme` 에 색 구성·타이포그래피·모양을 넣으면 하위 화면이 모두 따른다."
- key: nav
  name: 길잃음이
  desc: 어느 화면으로 갈지 잊어버린다.
  q: "Compose Navigation 에서 화면 이동을 실행하는 객체는?"
  hint: "이동을 '조종하는' 쪽."
  choices: ["NavHost", "NavController"]
  answer: 1
  why: "`NavController.navigate()` 로 이동한다. `NavHost` 는 목적지 화면들을 담는 틀이다."
- key: windowsize
  name: 찌그렁이
  desc: 큰 화면에서도 폰 모양 그대로 늘어난다.
  q: "화면 너비를 Compact·Medium·Expanded 로 나누는 기준은?"
  hint: "'창 크기 등급' 을 영어로."
  choices: ["WindowSizeClass", "DisplayMetrics"]
  answer: 0
  why: "창 크기 등급에 따라 탐색 방식이나 배치를 바꾸면 폰·폴더블·태블릿에 맞출 수 있다."
- key: internet
  name: 끊김이
  desc: 밖으로 나가는 길을 막아 둔다.
  q: "앱이 네트워크를 쓰려면 매니페스트에 넣어야 하는 권한은?"
  hint: "권한 이름이 곧 '인터넷' 이다."
  choices: ["CAMERA", "INTERNET"]
  answer: 1
  why: "`android.permission.INTERNET` 이 없으면 네트워크 요청이 실패한다. 사용자에게 묻지 않는 일반 권한이다."
- key: coil
  name: 빈액자
  desc: 주소만 있고 그림은 뜨지 않는다.
  q: "URL 의 이미지를 받아 Compose 에 그려 주는 라이브러리는?"
  hint: "`AsyncImage` 를 제공하는 쪽."
  choices: ["Coil", "Gson"]
  answer: 0
  why: "Coil 의 `AsyncImage` 가 내려받기·캐시·표시를 맡는다. Gson 은 JSON 변환 라이브러리다."
- key: select
  name: 못찾음이
  desc: 표 안의 자료를 꺼내지 못한다.
  q: "표에서 행을 읽어 오는 SQL 명령은?"
  hint: "'고르다' 를 영어로."
  choices: ["INSERT", "SELECT"]
  answer: 1
  why: "`SELECT` 는 조회, `INSERT` 는 추가다."
- key: dao
  name: 뒤죽이
  desc: 쿼리를 여기저기 흩어 놓는다.
  q: "Room 에서 조회·삽입 메서드를 모아 정의하는 것은?"
  hint: "Data Access Object 의 줄임말."
  choices: ["Entity", "DAO"]
  answer: 1
  why: "`@Dao` 인터페이스에 `@Query`·`@Insert` 메서드를 둔다. `@Entity` 는 표 하나를 나타내는 클래스다."
- key: datastore
  name: 잊음이
  desc: 앱을 껐다 켜면 설정을 잊는다.
  q: "간단한 설정값을 키-값으로 저장하는 Jetpack 라이브러리는?"
  hint: "SharedPreferences 의 뒤를 잇는 것."
  choices: ["Preferences DataStore", "Room"]
  answer: 0
  why: "DataStore 는 코루틴과 Flow 로 값을 읽고 쓴다. Room 은 표 형태의 자료에 쓴다."
- key: workmanager
  name: 미룸이
  desc: 나중에 한다더니 앱이 꺼지면 잊는다.
  q: "앱이 꺼져도 실행이 보장되어야 하는 백그라운드 작업에 쓰는 것은?"
  hint: "'작업 관리자' 를 영어로."
