---
title: 프로젝트
description: boram 이 만든 도구들.
nav: projects
---
    <div class="page-head page-head--row">
      <h1 class="handwrite">만든 도구들</h1>
      <span class="pen">두 번 반복한 일은 전부 여기로 왔다</span>
    </div>

    <div class="card-grid">
      {% for p in site.data.projects %}
      <article class="note-card project-card">
        <div class="polaroid-wrap">
          <div class="tape tape--{% cycle 'blue', 'sage', 'rose' %}"></div>
          <figure class="polaroid">
            <div class="polaroid-slot polaroid-slot--wide">
              <img src="/assets/icons/{{ p.image }}.svg" alt="" width="100" height="100">
            </div>
          </figure>
        </div>
        <h3>{{ p.name }}</h3>
        <p>{{ p.description }}</p>
        <div class="meta meta--mono">{{ p.stack }}</div>
      </article>
      {% endfor %}
    </div>

    <div class="closing-note">
      <img src="/assets/icons/rabbit-holding-lightbulb.svg" alt="전구를 들고 있는 토끼 캐릭터" width="76" height="76">
      <span class="pen">다음 도구는 뭐가 될까? 반복되는 일을 관찰하는 중...</span>
    </div>
